# A bytes object
encoded_msg = b"Hello, Python!" 

# Decoding bytes to a standard string
decoded_msg = encoded_msg.decode("utf-8")

print(decoded_msg)       # Output: Hello, Python!
print(type(decoded_msg)) # Output: <class 'str'>
